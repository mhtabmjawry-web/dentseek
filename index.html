function load(){try{const raw=localStorage.getItem(STORE);if(!raw)return {done:[],week:[],skills:{},cases:[],profile:{year:"",hours:8,name:""},dark:false};const s=JSON.parse(raw);return Object.assign({done:[],week:[],skills:{},cases:[],profile:{year:"",hours:8,name:""},dark:false},s)}catch(e){return {done:[],week:[],skills:{},cases:[],profile:{year:"",hours:8,name:""},dark:false}}}

function skillCounts(){const a={0:0,1:0,2:0,3:0,4:0};skills.forEach((s,i)=>{const v=state.skills[i]||"0";a[v]=(a[v]||0)+1});return a}

num">۳</div><div><b>بازیابی فعال و کیس</b><p>بدون نگاه به جزوه توضیح بده و دانش را روی سناریوی آموزشی به‌کار ببر.</p></div></div><div class="step"><div class="stepnum">۴</div><div><b>تمرین شبیه‌سازی</b><p>در محیط آموزشی و با تجهیزات مجاز، مهارت دستی را تکرار کن.</p></div></div><div class="step"><div class="stepnum">۵</div><div><b>بازخورد و ارزیابی</b><p>از استاد بازخورد مشخص بگیر، خطا را اصلاح کن و سطح مهارت را درست ثبت کن.</p></div></div></div></div></div><div class="grid" style="gap:16px"><div class="panel"><div class="panelhead"><div><h3>جلسه بعدی پیشنهادی</h3><p>برنامه هفتگی استاندارد ۸ ساعته</p></div><span class="tag gold">۸ ساعت</span></div><div class="callout"><strong>'+next.day+' · '+next.time+'</strong><br>'+next.title+'<br>'+next.detail+'</div><div style="margin-top:13px"><button class="btn small" data-action="goto" data-page="weekly">باز کردن برنامه</button></div></div><div class="panel"><div class="panelhead"><div><h3>دفتر مهارت‌ها</h3><p>چهار سطح آموزشی را جداگانه پیگیری کن</p></div><a class="textlink" href="#" data-action="goto" data-page="skills">مشاهده ←</a></div><div class="phase-list">'+Object.keys(statusLabels).map(k=>'<div class="phase-row"><div class="phase-num">'+k+'</div><div><b>'+statusLabels[k]+'</b><small>'+(k==="4"?"نیازمند تأیید مربی/استاد":"ثبت خودارزیابی آموزشی")+'</small></div><div class="phase-count">'+sc[k]+'</div></div>').join("")+'</div></div><div class="disclaimer"><strong>یادآوری ایمنی</strong><br>این داشبورد آموزشی است. مشاهده و تمرین مدل، مجوز درمان مستقل بیمار نیست. تصمیم و اجرای درمان واقعی باید در حدود صلاحیت، با رضایت معتبر و نظارت بالینی انجام شود.</div></div></div><div class="footer">DentPath · یک ابزار همراه یادگیری، نه جایگزین آموزش دانشگاهی یا قضاوت بالینی</div>'}
function roadmapView(){return '<div class="pagehead"><div><div class="eyebrow">مسیر از پایه تا مراقبت جامع</div><h1>نقشه‌راه جامع دندانپزشکی</h1><p>این مسیر بر اساس حوزه‌های رایج آموزش دندانپزشکی و چارچوب‌های صلاحیت حرفه‌ای تنظیم شده؛ ترتیب دقیق را با سرفصل دانشگاه خودت تطبیق بده.</p></div><button class="btn secondary" data-action="goto" data-page="curriculum">رفتن به سرفصل‌ها ←</button></div><div class="disclaimer" style="margin-bottom:16px">این نقشه‌راه جایگزین برنامه رسمی دانشکده، مقررات ملی یا ارزیابی صلاحیت نیست. سرعت هر مرحله را بر اساس سال تحصیلی، پیش‌نیازها و بازخورد استاد تنظیم کن.</div><div class="grid cards">'+phases.map((ph,i)=>{const n=ph.modules.filter(id=>state.done.includes(id)).length;return '<div class="card"><div class="cardtop"><span class="tag">'+(i+1)+' · مرحله</span><span class="phase-count">'+n+'/'+ph.modules.length+' مبحث</span></div><h3>'+ph.title+'</h3><div class="en">'+ph.en+'</div><p>'+ph.desc+'</p><div class="progressline"><span style="width:'+pct(n,ph.modules.length)+'%"></span></div><div class="cardfoot"><span class="smalltext muted">'+pct(n,ph.modules.length)+'٪ تکمیل</span><button class="btn small" data-action="phase" data-id="'+ph.id+'">دیدن مباحث</button></div></div>'}).join("")+'</div><div class="panel" style="margin-top:17px"><div class="panelhead"><div><h3>نقاط عطف پیشنهادی</h3><p>از شروع تا تثبیت عادت یادگیری مادام‌العمر</p></div></div><div class="timeline"><div class="timelineitem"><b>مرحله آغازین · ارزیابی وضعیت</b><p>سرفصل دانشگاه، نقاط ضعف، مهارت‌های انجام‌شده و منابع در دسترس را فهرست کن.</p></div><div class="timelineitem"><b>پایه‌سازی · علوم پایه و دندانپزشکی</b><p>آناتومی، فیزیولوژی، پاتولوژی، فارماکولوژی، مواد و مورفولوژی دندان را به هم وصل کن.</p></div><div class="timelineitem"><b>ورود به تفکر بالینی</b><p>شرح حال، معاینه، رادیولوژی، تشخیص افتراقی، طرح درمان و تصمیم ارجاع را تمرین کن.</p></div><div class="timelineitem"><b>پیش‌بالینی و کلینیک تحت نظارت</b><p>مهارت را از مشاهده به شبیه‌سازی و سپس اجرای تحت نظارت و ارزیابی استاد منتقل کن.</p></div><div class="timelineitem"><b>تثبیت و توسعه</b><p>کیس‌های چندتخصصی، مرور شواهد، پورتفولیو، بازخورد و آموزش مداوم.</p></div></div></div>'}

function weeklyView(){const planned=weekly.reduce((a,s)=>a+s.mins,0)/60;const doneMins=weekly.reduce((a,s,i)=>a+(state.week.includes(String(i))?s.mins:0),0);return '<div class="pagehead"><div><div class="eyebrow">پایداری مهم‌تر از فشردگی</div><h1>برنامه هفتگی مطالعه</h1><p>قالب پایه ۸ ساعت مطالعه تکمیلی. با کلاس‌ها، کلینیک، استراحت و شرایط زندگی خودت هماهنگش کن.</p></div><span class="tag gold">هدف: ۸ ساعت / هفته</span></div><div class="panel" style="margin-bottom:16px"><div class="panelhead"><div><h3>پیشرفت این هفته</h3><p>'+state.week.length+' جلسه از ۶ جلسه مطالعه ثبت شده</p></div><strong>'+pct(doneMins,480)+'٪</strong></div><div class="progressline"><span style="width:'+pct(doneMins,480)+'%"></span></div><div class="progress-caption"><span>'+Math.round(doneMins/60*10)/10+' ساعت ثبت‌شده</span><span>۸ ساعت هدف</span></div></div><div class="grid weekgrid">'+weekly.map((s,i)=>'<div class="weekday"><div class="weekdayhead"><b>'+s.day+'</b><span class="duration">'+s.time+'</span></div><label class="taskline '+(state.week.includes(String(i))?"done":"")+'"><input type="checkbox" data-action="week-done" data-id="'+i+'" '+(state.week.includes(String(i))?"checked":"")+' '+(!s.mins?"disabled":"")+'><span><b>'+s.title+'</b><small>'+s.detail+'</small></span></label></div>').join("")+'</div><div class="grid twocol" style="margin-top:16px"><div class="panel"><div class="panelhead"><h3>قواعد اجرای برنامه</h3></div><ul class="smalltext muted"><li>هر جلسه را با یک خروجی مشخص تمام کن، نه صرفاً زمان مطالعه.</li><li>برای مرور از بازیابی فعال و فاصله‌گذاری استفاده کن.</li><li>تمرین دستی فقط در فضای آموزشی و مطابق نظر مربی انجام شود.</li><li>هفته شلوغ را با نسخه کوتاه‌تر ادامه بده؛ زنجیره یادگیری را حفظ کن.</li><li>هر چهار هفته، برنامه را با توجه به بازخورد و ضعف‌ها بازبینی کن.</li></ul></div><div class="panel"><div class="panelhead"><h3>پیشنهاد خروجی هفتگی</h3></div><div class="steps"><div class="step"><div class="stepnum">۱</div><div><b>یک صفحه خلاصه علمی</b><p>نقشه مفهومی یا خلاصه از یک موضوع.</p></div></div><div class="step"><div class="stepnum">۲</div><div><b>یک تمرین ثبت‌شده</b><p>هدف، تعداد تکرار، خطا و بازخورد مربی.</p></div></div><div class="step"><div class="stepnum">۳</div><div><b>یک تحلیل کیس</b><p>مسئله، تشخیص افتراقی، گزینه‌ها و منبع شواهد.</p></div></div></div></div></div>'}
function skillsView(){const counts=skillCounts();return '<div class="pagehead"><div><div class="eyebrow">پورتفولیوی مهارت و ارزیابی</div><h1>دفتر مهارت‌ها</h1><p>سطح هر مهارت را واقع‌بینانه ثبت کن. سطح «تأیید استاد» فقط بعد از ارزیابی واقعی توسط مربی/استاد انتخاب شود.</p></div><span class="tag">۴۰ مهارت پایه</span></div><div class="grid stats"><div class="stat"><div class="stat-icon">○</div><div><strong>'+counts[0]+'</strong><small>شروع نشده</small></div></div><div class="stat"><div class="stat-icon">◉</div><div><strong>'+counts[1]+'</strong><small>مشاهده شده</small></div></div><div class="stat"><div class="stat-icon">✦</div><div><strong>'+counts[2]+'</strong><small>تمرین شبیه‌سازی</small></div></div><div class="stat"><div class="stat-icon">✓</div><div><strong>'+counts[3]+' / '+counts[4]+'</strong><small>تحت نظارت / تأیید استاد</small></div></div></div><div class="disclaimer" style="margin-bottom:14px">این دفتر ابزار خودارزیابی و یادآوری است، نه مدرک صلاحیت حرفه‌ای. موارد مربوط به بیمار فقط مطابق مقررات دانشکده و زیر نظارت مستقیم انجام می‌شوند. برای تأیید نهایی، معیارهای رسمی و مستند استاد را ثبت کن.</div>'+["ایمنی و تشخیص","پیش‌بالینی و ترمیمی","اندودانتیکس و پریو","جراحی و اورژانس","حرفه‌ای"].map(group=>'<div class="panel" style="margin-bottom:14px"><div class="panelhead"><h3>'+group+'</h3><span class="smalltext muted">'+skills.filter(s=>s[0]===group).length+' مهارت</span></div><div class="tablewrap"><table class="skilltable"><thead><tr><th>مهارت</th><th>حوزه</th><th>سطح فعلی</th></tr></thead><tbody>'+skills.map((s,i)=>({s,i})).filter(o=>o.s[0]===group).map(o=>'<tr><td class="skillname"><b>'+o.s[1]+'</b><small>شناسه آموزشی: SK-'+String(o.i+1).padStart(2,"0")+'</small></td><td>'+o.s[2]+'</td><td><select class="select skillselect" data-action="skill-status" data-id="'+o.i+'">'+Object.keys(statusLabels).map(k=>'<option value="'+k+'" '+((state.skills[o.i]||"0")===k?"selected":"")+'>'+statusLabels[k]+'</option>').join("")+'</select></td></tr>').join("")+'</tbody></table></div></div>').join("")}
function casesView(){return '<div class="pagehead"><div><div class="eyebrow">تفکر بالینی و بازتاب</div><h1>دفتر کیس‌های آموزشی</h1><p>کیس‌های ساختگی یا کاملاً بی‌نام را برای تمرین تشخیص و تصمیم‌گیری ثبت کن.</p></div><button class="btn" data-action="new-case">＋ ثبت کیس آموزشی</button></div><div class="disclaimer" style="margin-bottom:16px"><strong>حریم خصوصی:</strong> نام، شماره پرونده، تاریخ تولد، شماره تماس، تصویر قابل‌شناسایی یا هر داده‌ای که بیمار را شناسایی کند وارد نکن. این داده‌ها فقط روی همین مرورگر ذخیره می‌شوند؛ بااین‌حال از ثبت اطلاعات واقعی بیمار خودداری کن و قوانین دانشگاه را رعایت کن.</div><div class="grid twocol"><div class="panel"><div class="panelhead"><div><h3>قالب تحلیل کیس</h3><p>برای هر کیس از ساختار ثابت استفاده کن</p></div></div><div class="steps"><div class="step"><div class="stepnum">۱</div><div><b>تعریف مسئله و شکایت اصلی</b><p>علائم، مدت، شدت، عوامل تشدید/تسکین و زمینه پزشکی.</p></div></div><div class="step"><div class="stepnum">۲</div><div><b>داده‌های عینی و آزمون‌ها</b><p>معاینه، تست‌ها، تصویر مناسب و محدودیت داده‌ها.</p></div></div><div class="step"><div class="stepnum">۳</div><div><b>تشخیص‌های افتراقی</b><p>شواهد موافق/مخالف و داده‌های موردنیاز برای افتراق.</p></div></div><div class="step"><div class="stepnum">۴</div><div><b>گزینه‌ها و تصمیم</b><p>گزینه‌ها، منافع، ریسک‌ها، ترجیح بیمار و معیار ارجاع.</p></div></div><div class="step"><div class="stepnum">۵</div><div><b>بازتاب و بازخورد</b><p>چه چیزی یاد گرفتم؟ چه چیزی را باید از استاد بپرسم؟</p></div></div></div></div><div class="panel"><div class="panelhead"><h3>آمار دفتر کیس</h3></div><div class="kpi"><div class="ring" style="--p:'+pct(state.cases.length,10)+'"><span>'+state.cases.length+'</span></div><div><b>'+state.cases.length+' کیس</b><small>ثبت‌شده در این مرورگر</small><p class="smalltext muted">هدف پیشنهادی: هر ماه چند کیس باکیفیت، نه ثبت تعداد زیاد بدون تحلیل.</p></div></div><div class="notice">هر کیس پیچیده، مبهم یا خارج از سطح مهارت خود را به استاد/متخصص ارجاع بده. تحلیل آموزشی نباید به توصیه درمانی برای بیمار واقعی تبدیل شود.</div></div></div><div style="margin-top:17px"><div class="panelhead"><h3>کیس‌های ثبت‌شده</h3><span class="smalltext muted">'+state.cases.length+' مورد</span></div>'+(state.cases.length?state.cases.slice().reverse().map(c=>'<div class="caseitem"><div class="cardtop"><span class="tag">'+esc(c.category)+'</span><span class="smalltext muted">'+esc(c.date)+'</span></div><h4>'+esc(c.title)+'</h4><p><b>شکایت/مسئله:</b> '+esc(c.problem)+'</p><p><b>تشخیص افتراقی:</b> '+esc(c.differential)+'</p><p><b>پرسش یا بازتاب:</b> '+esc(c.reflection)+'</p><div class="casefoot"><span>'+(c.reviewed?"بازبینی آموزشی ثبت شده":"در انتظار بازخورد استاد")+'</span><button class="textlink" data-action="delete-case" data-id="'+esc(c.id)+'">حذف</button></div></div>').join(""):'<div class="empty"><div class="emoji">▧</div>هنوز کیس آموزشی ثبت نکرده‌ای.<br>یک کیس کاملاً ساختگی را برای تمرین تحلیل وارد کن.</div>')+'</div>'}
function evidenceView(){return '<div class="pagehead"><div><div class="eyebrow">از سؤال تا تصمیم بالینی</div><h1>دندانپزشکی مبتنی بر شواهد</h1><p>مهارت جست‌وجو و ارزیابی علمی را مثل مهارت دستی تمرین کن.</p></div><span class="tag">Evidence-Based Dentistry</span></div><div class="grid twocol"><div class="panel"><div class="panelhead"><h3>سازنده سؤال PICO</h3><p>برای صورت‌بندی سؤال قابل جست‌وجو</p></div><div class="field"><label>جمعیت / مشکل (P)</label><input id="picoP" placeholder="مثلاً بزرگسالان مبتلا به پوسیدگی ریشه"></div><div class="field"><label>مداخله (I)</label><input id="picoI" placeholder="مثلاً فلورایدتراپی موضعی"></div><div class="field"><label>مقایسه (C)</label><input id="picoC" placeholder="مثلاً مراقبت معمول"></div><div class="field"><label>پیامد (O)</label><input id="picoO" placeholder="مثلاً توقف پیشرفت ضایعه"></div><button class="btn" data-action="make-pico">ساخت سؤال پژوهشی</button><div class="callout hidden" id="picoOutput" style="margin-top:13px"></div></div><div class="panel"><div class="panelhead"><h3>فرایند شش‌مرحله‌ای</h3></div><div class="steps"><div class="step"><div class="stepnum">۱</div><div><b>Ask</b><p>سؤال روشن، بیمارمحور و قابل پاسخ بساز.</p></div></div><div class="step"><div class="stepnum">۲</div><div><b>Acquire</b><p>گایدلاین، مرور نظام‌مند و مطالعات اولیه را جست‌وجو کن.</p></div></div><div class="step"><div class="stepnum">۳</div><div><b>Appraise</b><p>اعتبار، خطر سوگیری، دقت و قطعیت را بسنج.</p></div></div><div class="step"><div class="stepnum">۴</div><div><b>Apply</b><p>شواهد را با وضعیت و ترجیحات بیمار و مهارت خود تلفیق کن.</p></div></div><div class="step"><div class="stepnum">۵</div><div><b>Assess</b><p>پیامد و تجربه را ارزیابی کن.</p></div></div><div class="step"><div class="stepnum">۶</div><div><b>Update</b><p>با انتشار شواهد تازه، تصمیم را بازبینی کن.</p></div></div></div></div></div><div class="panel" style="margin-top:16px"><div class="panelhead"><h3>چک‌لیست نقد مقاله</h3><span class="tag">قابل استفاده برای هر مقاله</span></div><div class="grid cards">'+[["سؤال","آیا هدف و جمعیت مطالعه روشن است؟"],["طراحی","آیا نوع مطالعه برای سؤال مناسب است؟"],["نمونه","آیا حجم نمونه، انتخاب و پیگیری مناسب‌اند؟"],["سوگیری","آیا تصادفی‌سازی، پنهان‌سازی و کورسازی بررسی شده؟"],["نتایج","اندازه اثر، فاصله اطمینان و اهمیت بالینی چیست؟"],["قطعیت","محدودیت‌ها، ناهمگونی و کیفیت شواهد چیست؟"],["تعمیم","آیا نتایج به بیمار و زمینه من قابل تعمیم‌اند؟"],["مالی","منابع مالی و تعارض منافع چیست؟"],["تصمیم","آیا شواهد با ارزش‌ها و انتخاب بیمار هم‌راستا است؟"]].map(x=>'<div class="card"><span class="tag gray">'+x[0]+'</span><p>'+x[1]+'</p></div>').join("")+'</div></div><div class="notice"><strong>ترتیب پیشنهادی منابع</strong>برای تصمیم بالینی ابتدا گایدلاین معتبر و به‌روز را بررسی کن، سپس مرور نظام‌مند و مطالعات اولیه را بخوان. سلسله‌مراتب شواهد به‌تنهایی کافی نیست؛ کیفیت، تناسب و قطعیت مهم‌اند.</div>'}
function safetyView(){const checks=[["پیش از درمان","هویت بیمار و تطبیق پرونده با بیمار طبق پروتکل"],["پیش از درمان","شرح حال، بیماری‌ها، داروها، حساسیت و تغییرات جدید"],["پیش از درمان","ارزیابی نیاز به مشاوره پزشکی و خطرات اختصاصی"],["پیش از درمان","تشخیص، هدف، گزینه‌ها، خطرات و رضایت آگاهانه"],["پیش از درمان","تصویربرداری فقط با توجیه و انتخاب مناسب"],["محیط ایمن","بهداشت دست، PPE، استریلیزاسیون و کنترل محیط"],["محیط ایمن","بررسی ابزار، مواد، تاریخ مصرف و عملکرد تجهیزات"],["حین درمان","تأیید طرح درمان با استاد و حدود صلاحیت دانشجو"],["حین درمان","توقف و درخواست کمک در ابهام، عارضه یا تغییر وضعیت"],["پس از درمان","ثبت یافته‌ها، درمان، مواد، توصیه و پیگیری"],["پس از درمان","اطمینان از فهم بیمار و علائم هشدار/زمان مراجعه"],["پس از درمان","بررسی نتیجه و ثبت بازخورد/رخداد برای بهبود"]];return '<div class="pagehead"><div><div class="eyebrow">مراقبت ایمن و مسئولانه</div><h1>ایمنی و حرفه‌ای‌گری</h1><p>چک‌لیست آموزشی برای یادآوری حوزه‌های کلیدی؛ پروتکل دانشکده، دستورالعمل محلی و نظر استاد همیشه مقدم‌اند.</p></div><span class="tag gold">Patient Safety</span></div><div class="disclaimer" style="margin-bottom:15px">این چک‌لیست یک ابزار عمومی آموزشی است، نه دستورالعمل بالینی کامل. برای موارد اورژانسی، دارودرمانی، بی‌حسی، آرام‌بخشی و اقدامات تهاجمی باید آموزش معتبر، تجهیزات، پروتکل محل و نظارت صلاحیت‌دار وجود داشته باشد.</div><div class="panel"><div class="panelhead"><h3>چک‌لیست پیش از/حین/پس از درمان</h3><button class="btn small secondary" data-action="reset-safety">بازنشانی</button></div><div class="grid cards">'+["پیش از درمان","محیط ایمن","حین درمان","پس از درمان"].map(group=>'<div class="card"><div class="cardtop"><h3>'+group+'</h3><span class="tag">'+checks.filter(c=>c[0]===group).length+' مورد</span></div>'+checks.map((c,i)=>({c,i})).filter(o=>o.c[0]===group).map(o=>'<label class="taskline"><input type="checkbox" class="safety-check"><span><b>'+o.c[1]+'</b></span></label>').join("")+'</div>').join("")+'</div><p class="smalltext muted">تیک‌ها موقتی‌اند و به‌عنوان ثبت انجام اقدام واقعی یا تأیید صلاحیت ذخیره نمی‌شوند.</p></div><div class="grid twocol" style="margin-top:16px"><div class="panel"><div class="panelhead"><h3>رفتارهای حرفه‌ای</h3></div><ul class="smalltext muted"><li>صداقت در بیان سطح مهارت و محدودیت‌ها.</li><li>احترام به اختیار، ارزش‌ها، فرهنگ و حریم خصوصی بیمار.</li><li>درخواست کمک و ارجاع به‌موقع؛ نه پنهان کردن عدم قطعیت.</li><li>ثبت کامل، دقیق و بدون دستکاری پرونده.</li><li>پذیرش بازخورد، گزارش خطا و یادگیری از آن.</li><li>جداکردن شواهد علمی از تبلیغات و تعارض منافع.</li></ul></div><div class="panel"><div class="panelhead"><h3>علائم نیازمند توقف و کمک</h3></div><ul class="smalltext muted"><li>تغییر ناگهانی وضعیت عمومی یا علائم حیاتی.</li><li>تنگی نفس، واکنش حساسیتی شدید یا کاهش سطح هوشیاری.</li><li>درد/تورم سریعاً پیشرونده، تب یا نشانه‌های انتشار عفونت.</li><li>خونریزی کنترل‌نشده یا آسیب غیرمنتظره.</li><li>شک به تشخیص یا درمان خارج از صلاحیت و امکانات.</li></ul><div class="callout">در شرایط واقعی، پروتکل اورژانس محل و خدمات اورژانس محلی را فعال کن؛ این فهرست جایگزین آموزش BLS یا راهنمای بالینی نیست.</div></div></div>'}
function libraryView(){return '<div class="pagehead"><div><div class="eyebrow">کتاب‌های مرجع پیشنهادی</div><h1>کتابخانه کتاب‌ها</h1><p>برای فهم عمیق از کتاب مرجع استفاده کن و با گایدلاین‌های جدید، دانسته‌ها را به‌روز نگه دار.</p></div><span class="tag gold">مطالعه ساختاریافته</span></div><div class="disclaimer" style="margin-bottom:15px">بیشتر کتاب‌های زیر تجاری و دارای حق نشرند؛ از کتابخانه دانشگاه، نسخه قانونی یا دسترسی سازمانی استفاده کن. این فهرست به معنی رایگان بودن کتاب‌ها یا توصیه دانلود غیرمجاز نیست. ویرایش مناسب را با استاد و سرفصل درس تطبیق بده.</div><div class="grid bookgrid">'+books.map((b,i)=>'<div class="book"><div class="cardtop"><span class="tag gray">'+String(i+1).padStart(2,"0")+'</span><span class="smalltext muted">کتاب مرجع</span></div><b>'+b[0]+'</b><small>'+b[1]+'</small></div>').join("")+'</div><div class="panel" style="margin-top:16px"><div class="panelhead"><h3>چطور کتاب بخوانی؟</h3></div><div class="grid cards"><div class="card"><span class="tag">پیش از مطالعه</span><h3>هدف مشخص</h3><p>سرفصل، اهداف آموزشی و پرسش بالینی را مشخص کن.</p></div><div class="card"><span class="tag">حین مطالعه</span><h3>یادداشت فعال</h3><p>نقشه مفهومی، الگوریتم، جدول مقایسه و پرسش بساز.</p></div><div class="card"><span class="tag">پس از مطالعه</span><h3>بازیابی و کاربرد</h3><p>کتاب را ببند، مطلب را توضیح بده و آن را روی کیس آموزشی به‌کار ببر.</p></div></div></div>'}
function render(){shellTitle();const root=document.getElementById("viewRoot");const views={home:homeView,roadmap:roadmapView,curriculum:curriculumView,resources:resourcesView,weekly:weeklyView,skills:skillsView,cases:casesView,evidence:evidenceView,safety:safetyView,library:libraryView};root.innerHTML=(views[page]||homeView)();document.body.classList.toggle("dark",!!state.dark);document.getElementById("profileLabel").textContent=state.profile.name||"پروفایل دانشجو";document.getElementById("themeBtn").textContent=state.dark?"☀":"☾";wirePage()}
function openModal(title,body,footer){document.getElementById("modalRoot").innerHTML='<div class="modalback" data-action="backdrop-close"><div class="modal"><div class="modalhead"><h3>'+title+'</h3><button class="modalclose" data-action="close-modal">×</button></div><div class="modalbody">'+body+'</div>'+(footer?'<div style="margin-top:18px;display:flex;justify-content:flex-end;gap:8px">'+footer+'</div>':"")+'</div></div>'}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function moduleDetail(id){const m=modules.find(x=>x.id===id);if(!m)return;const body='<div class="cardtop"><span class="tag">'+phases[m.phase-1].title+'</span><span class="tag gray">'+m.category+'</span></div><p><strong>چرا مهم است؟</strong><br>'+m.why+'</p><h4>محورهای یادگیری</h4><ul>'+m.topics.map(t=>'<li>'+t+'</li>').join("")+'</ul><h4>تمرین پیشنهادی</h4><p>'+m.practice+'</p>'+(m.check?'<h4>معیار بررسی</h4><p>'+m.check+'</p>':"")+'<h4>منابع مرتبط</h4><p>'+(m.resources&&m.resources.length?m.resources.map(id=>{const r=resources.find(x=>x.id===id);return r?'<a class="textlink" target="_blank" rel="noopener" href="'+r.url+'">'+r.title+' ↗</a>':""}).join("<br>"):"از کتاب مرجع، محتوای درس و راهنمای رسمی مرتبط استفاده کن.")+'</p><div class="disclaimer">این محتوای آموزشی است؛ مراحل درمان واقعی را فقط بر اساس آموزش رسمی، راهنمای به‌روز، قوانین محل و نظارت بالینی اجرا کن.</div>';openModal(m.name,body,'<button class="btn secondary" data-action="close-modal">بستن</button><button class="btn" data-action="toggle-module" data-id="'+id+'">'+(state.done.includes(id)?"برداشتن تیک تکمیل":"علامت‌گذاری به‌عنوان تکمیل")+'</button>')}
function profileModal(){const p=state.profile;const body='<div class="profileform"><div class="field"><label>نام نمایشی (اختیاری)</label><input id="profName" maxlength="35" value="'+esc(p.name||"")+'" placeholder="مثلاً دانشجوی دندانپزشکی"></div><div class="field"><label>سال تحصیلی / وضعیت فعلی</label><select id="profYear"><option value="">انتخاب نشده</option>'+["سال اول","سال دوم","سال سوم","سال چهارم","سال پنجم / کارآموزی","فارغ‌التحصیل / دندانپزشک عمومی"].map(x=>'<option '+(p.year===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div><div class="field"><label>هدف ساعت مطالعه تکمیلی در هفته</label><select id="profHours">'+[4,6,8,10,12,14].map(x=>'<option value="'+x+'" '+(Number(p.hours)===x?"selected":"")+'>'+x+' ساعت</option>').join("")+'</select></div><p class="smalltext muted">این اطلاعات فقط روی همین مرورگر ذخیره می‌شود و برای شخصی‌سازی داشبورد استفاده می‌شود.</p></div>';openModal("پروفایل یادگیری",body,'<button class="btn secondary" data-action="close-modal">انصراف</button><button class="btn" data-action="save-profile">ذخیره پروفایل</button>')}
function newCaseModal(){const body='<form id="caseForm"><div class="fieldgrid"><div class="field"><label>عنوان کوتاه و بی‌نام</label><input name="title" required maxlength="80" placeholder="مثلاً درد دندان خلفی – سناریوی فرضی"></div><div class="field"><label>حوزه</label><select name="category"><option>تشخیص</option><option>ترمیمی</option><option>اندودانتیکس</option><option>پریودنتولوژی</option><option>جراحی</option><option>پروتز</option><option>کودکان</option><option>اورژانس</option><option>سایر</option></select></div></div><div class="field"><label>تعریف مسئله / شکایت اصلی</label><textarea name="problem" required maxlength="1400" placeholder="شرح حال و یافته‌های ساختگی یا کاملاً بی‌نام..."></textarea></div><div class="field"><label>تشخیص‌های افتراقی و داده‌های لازم</label><textarea name="differential" maxlength="1400" placeholder="تشخیص‌های احتمالی، شواهد موافق/مخالف و تست‌های بعدی..."></textarea></div><div class="field"><label>پرسش یا بازتاب یادگیری</label><textarea name="reflection" maxlength="1000" placeholder="چه چیزی یاد گرفتم؟ چه چیزی نیاز به بررسی یا سؤال از استاد دارد؟"></textarea></div><label class="taskline"><input type="checkbox" name="reviewed"><span><b>این تحلیل با استاد/مربی مرور شده است</b><small>فقط پس از بازخورد واقعی علامت بزن.</small></span></label><div class="disclaimer">اطلاعات شناسایی‌کننده بیمار وارد نکن. از تصویر و داده پرونده واقعی در این ابزار استفاده نکن.</div></form>';openModal("ثبت کیس آموزشی",body,'<button class="btn secondary" data-action="close-modal">انصراف</button><button class="btn" data-action="save-case">ثبت کیس</button>')}
function wirePage(){const ms=document.getElementById("moduleSearch");if(ms)ms.addEventListener("input",e=>{searchText=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById("moduleSearch");if(n){n.focus();n.setSelectionRange(pos,pos)}});const rs=document.getElementById("resourceSearch");if(rs)rs.addEventListener("input",e=>{searchText=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById("resourceSearch");if(n){n.focus();n.setSelectionRange(pos,pos)}});const pf=document.getElementById("phaseFilter");if(pf)pf.addEventListener("change",e=>{filterPhase=e.target.value;render()});const rf=document.getElementById("resourceFilter");if(rf)rf.addEventListener("change",e=>{filterResource=e.target.value;render()})}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b)setPage(b.dataset.page)});
document.getElementById("viewRoot").addEventListener("click",e=>{const el=e.target.closest("[data-action]");if(!el)return;const a=el.dataset.action,id=el.dataset.id;
if(a==="goto")setPage(el.dataset.page);
if(a==="phase"){filterPhase=id;setPage("curriculum")}
if(a==="module-detail")moduleDetail(id);
if(a==="toggle-module"){if(state.done.includes(id))state.done=state.done.filter(x=>x!==id);else state.done.push(id);save();closeModal();render();toast("پیشرفت مبحث ذخیره شد.")}
if(a==="new-case")newCaseModal();
if(a==="delete-case"){if(confirm("این کیس آموزشی حذف شود؟")){state.cases=state.cases.filter(c=>c.id!==id);save();render();toast("کیس حذف شد.")}}
if(a==="make-pico"){const p=document.getElementById("picoP").value.trim(),i=document.getElementById("picoI").value.trim(),c=document.getElementById("picoC").value.trim(),o=document.getElementById("picoO").value.trim();const out=document.getElementById("picoOutput");out.classList.remove("hidden");out.innerHTML="<strong>سؤال پژوهشی پیشنهادی:</strong><br>در "+esc(p||"[جمعیت/مشکل]")+"، آیا "+esc(i||"[مداخله]")+" در مقایسه با "+esc(c||"[مقایسه]")+" باعث بهبود "+esc(o||"[پیامد]")+" می‌شود؟"; }
if(a==="reset-safety"){document.querySelectorAll(".safety-check").forEach(x=>x.checked=false);toast("چک‌لیست پاک شد؛ این تیک‌ها ذخیره نمی‌شوند.")}
});
document.getElementById("viewRoot").addEventListener("change",e=>{const t=e.target,a=t.dataset.action,id=t.dataset.id;if(a==="module-done"){if(t.checked&&!state.done.includes(id))state.done.push(id);if(!t.checked)state.done=state.done.filter(x=>x!==id);save();render();toast("پیشرفت ذخیره شد.")}if(a==="week-done"){if(t.checked&&!state.week.includes(id))state.week.push(id);if(!t.checked)state.week=state.week.filter(x=>x!==id);save();render()}if(a==="skill-status"){state.skills[id]=t.value;save();toast("سطح مهارت ذخیره شد.")}});
document.getElementById("modalRoot").addEventListener("click",e=>{const el=e.target.closest("[data-action]");if(!el)return;if(el.dataset.action==="close-modal")closeModal();if(el.dataset.action==="backdrop-close"&&e.target.classList.contains("modalback"))closeModal();if(el.dataset.action==="save-profile"){state.profile.name=document.getElementById("profName").value.trim();state.profile.year=document.getElementById("profYear").value;state.profile.hours=Number(document.getElementById("profHours").value);save();closeModal();render();toast("پروفایل ذخیره شد.")}if(el.dataset.action==="save-case"){const f=document.getElementById("caseForm");if(!f.reportValidity())return;const d=new FormData(f);state.cases.push({id:String(Date.now()),date:new Date().toLocaleDateString("fa-IR"),title:d.get("title"),category:d.get("category"),problem:d.get("problem"),differential:d.get("differential"),reflection:d.get("reflection"),reviewed:d.get("reviewed")==="on"});save();closeModal();render();toast("کیس آموزشی ذخیره شد.")}});
document.getElementById("profileBtn").addEventListener("click",profileModal);
document.getElementById("themeBtn").addEventListener("click",()=>{state.dark=!state.dark;save();render()});
document.getElementById("backupBtn").addEventListener("click",()=>{const data=JSON.stringify(state,null,2),blob=new Blob([data],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="dentpath-backup.json";a.click();URL.revokeObjectURL(url);toast("فایل پشتیبان آماده شد.")});
document.getElementById("importFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!Array.isArray(v.done)||!Array.isArray(v.cases))throw new Error("invalid");state=Object.assign(load(),v);save();render();toast("پشتیبان بازیابی شد.")}catch(err){toast("فایل پشتیبان معتبر نیست.")}e.target.value=""});
window.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
render();
})();
</script>
</body>
</html>
